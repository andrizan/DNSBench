name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            extension: .exe
          - os: windows
            arch: arm64
            runner: windows-latest
            extension: .exe
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            extension: ''
          - os: linux
            arch: arm64
            runner: ubuntu-latest
            extension: ''
          - os: darwin
            arch: amd64
            runner: macos-latest
            extension: ''
          - os: darwin
            arch: arm64
            runner: macos-latest
            extension: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build binary
        run: |
          go build -ldflags="-w -s" -o dnsbench-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dnsbench-${{ matrix.os }}-${{ matrix.arch }}
          path: dnsbench-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff butuh riwayat + tags penuh

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
