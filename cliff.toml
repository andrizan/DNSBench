# Konfigurasi git-cliff (https://git-cliff.org) — pembangkit CHANGELOG
# otomatis dari Conventional Commits. Dipakai oleh workflow `Changelog`.

[changelog]
header = """
# Changelog\n
Semua perubahan penting proyek ini dicatat otomatis di berkas ini
oleh [git-cliff](https://git-cliff.org), mengikuti format
[Keep a Changelog](https://keepachangelog.com/en/1.0.0/).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.github.commit_url }}/{{ commit.id }}))\
            {% if commit.github.username %} - @{{ commit.github.username }}{% endif %}
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v*"
skip_tags = "v0.1.0"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/andrizan/DNSBench/issues/$1" },
]
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^doc", group = "<!-- 2 -->Documentation" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^refactor", group = "<!-- 4 -->Refactored" },
    { message = "^style", group = "<!-- 5 -->Styling" },
    { message = "^test", group = "<!-- 6 -->Testing" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore", group = "<!-- 7 -->Miscellaneous Tasks" },
    { message = "^ci", group = "<!-- 7 -->Miscellaneous Tasks" },
    { message = "^build", group = "<!-- 7 -->Miscellaneous Tasks" },
    { message = ".*", group = "<!-- 8 -->Other" },
]

[remote.github]
owner = "andrizan"
repo = "DNSBench"
